      type: string
      nullable: true
    nomeSubPoloCentralizador:
      type: string
      nullable: true
    indicadorSituacaoOrgao:
      type: string
      nullable: true
    descricaoSituacaoOrgao:
      type: string
      nullable: true
    codigoSituacaoBloqueioMoedaEstrangeira:
      type: string
      nullable: true
    descricaoBloqueioMoedaEstrangeira:
      type: string
      nullable: true
    matriz:
      type: string
      nullable: true
    agenciaCustodianteBb:
