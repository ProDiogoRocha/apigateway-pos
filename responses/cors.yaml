# Os headers precisam estar declarados aqui: a integração mock (extensions/cors-preflight.yaml) os preenche.
Preflight:
  description: Preflight CORS respondido pelo API Gateway.
  headers:
    Access-Control-Allow-Origin:
      schema:
        type: string
    Access-Control-Allow-Methods:
      schema:
        type: string
    Access-Control-Allow-Headers:
      schema:
        type: string
    Access-Control-Max-Age:
      schema:
        type: string
