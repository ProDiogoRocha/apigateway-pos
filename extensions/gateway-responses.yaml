# Respostas geradas pelo próprio API Gateway (a Lambda não é invocada).
# Todas levam o header CORS (senão o front não lê o erro); um tipo declarado aqui não herda os
# parâmetros do DEFAULT_4XX/5XX, por isso o header se repete.
# As mais comuns seguem o formato de erro da Lambda: { "messages": [{ "codigo", "mensagem" }] }.

# Rota ou método inexistente: o API Gateway responderia 403 "Missing Authentication Token".
MISSING_AUTHENTICATION_TOKEN:
  statusCode: '404'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"404","mensagem":"Recurso inexistente."}]}'

THROTTLED:
  statusCode: '429'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"429","mensagem":"Limite de requisicoes excedido."}]}'

INTEGRATION_FAILURE:
  statusCode: '502'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"502","mensagem":"Erro interno."}]}'

INTEGRATION_TIMEOUT:
  statusCode: '504'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"504","mensagem":"Tempo de resposta excedido."}]}'

# Demais tipos de erro do API Gateway: corpo padrão da AWS, com CORS.
DEFAULT_4XX:
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"message":$context.error.messageString}'

DEFAULT_5XX:
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"message":$context.error.messageString}'

UNAUTHORIZED:
  statusCode: '401'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"401","mensagem":"Nao autorizado."}]}'

ACCESS_DENIED:
  statusCode: '403'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"403","mensagem":"Acesso negado."}]}'

AUTHORIZER_FAILURE:
  statusCode: '500'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"500","mensagem":"Falha no authorizer STS."}]}'

AUTHORIZER_CONFIGURATION_ERROR:
  statusCode: '500'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"500","mensagem":"Falha na configuracao do authorizer STS."}]}'

BAD_REQUEST_PARAMETERS:
  statusCode: '400'
  responseParameters:
    gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
  responseTemplates:
    application/json: '{"messages":[{"codigo":"400","mensagem":"Parametros obrigatorios ausentes ou invalidos."}]}'
