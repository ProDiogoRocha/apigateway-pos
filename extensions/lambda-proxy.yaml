# Integração proxy: o API Gateway repassa a requisição inteira para a Lambda e devolve a resposta dela.
# ${lambda_invoke_arn} é preenchido pelo Terraform (templatefile em infra/main.tf).
type: aws_proxy
httpMethod: POST
uri: '${lambda_invoke_arn}'
passthroughBehavior: when_no_match
timeoutInMillis: 29000
